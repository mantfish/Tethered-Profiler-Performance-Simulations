# Quick-start example for main.py: one short run per WAMIT case, a few minutes in total.
# The paper sweeps are run with scripts/run_lut_sweep.py and scripts/run_validation_sweep.py,
# which use the same settings plus a per-case simulation time (see README).
paths:
  dat_template: "./data/template.dat"
  dat_outdir: "./data/dat_files/_generated"
  output_dir: "./results/example/"
  wave_dir: "./data/waves/lut_sweep/"

system:
  n: 2                     # tether length = n * depth
  density: 1025
  clean_temp_files: true
  wamit_dir:
    - "data/wamit/ArgoBoxStiffness"   # K_L, large heave stiffness
    - "data/wamit/ArgoSubmergedBox"   # K_S, small heave stiffness

sweep:
  depths: [20]
  current_speeds: [0.10]
  waves:
    mode: "files"          # "files" or "none"
    fp_tokens: [0.3276]    # Hs 0.49 m, Tp 3.05 s
    hs_tokens: [0.4869]
    use_all: false         # if true, ignore tokens and use all wave files in wave_dir
    limit: null            # or integer to cap number of wave files

timing:
  save_interval: 0.2
  steady_state_tol: 1.0e-5
  start_pos: "end"         # start at the stretched tether position
  dt_table:                # max solver step per current speed; 5e-4 for every speed in the paper
    "0.05": 5e-4
    "0.10": 5e-4
    "0.125": 5e-4
    "0.15": 5e-4
    "0.175": 5e-4
    "0.20": 5e-4
    "0.25": 5e-4
    "0.30": 5e-4
  sim_time:
    mode: "fixed"          # "fixed" or "speed_depth"
    fixed: 30              # seconds; the paper runs use 300 s (1000 s for 0.30 m/s at >= 50 m)
    base: 5                # used for speed_depth
    multiplier: 0.8660254  # sqrt(3)/2

runner:
  workers: 2
  skip_existing: true
  quiet_moordyn: true
