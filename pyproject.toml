[project]
name = "tethered-profiler-simulations"
version = "1.0.0"
description = "Coupled MoorDyn / WAMIT simulations of a tethered profiling float, lookup tables and surfacing maps for 'Feasibility of Tethered Profiling Floats for Coastal Observations'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.8",
    "moordyn>=2.4.0",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pyyaml>=6.0.3",
    "scipy>=1.17.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
# Annual surfacing maps (maps/): Copernicus Marine download, EMODnet bathymetry, plotting
maps = [
    "cartopy>=0.25.0",
    "copernicusmarine>=2.3.0",
    "dask>=2026.1.2",
    "h5netcdf>=1.8.1",
    "netcdf4>=1.7.4",
    "pyarrow>=23.0.0",
    "xarray>=2026.1.0",
]
